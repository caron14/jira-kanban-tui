[package]
name = "jira-kanban-tui"
version = "0.1.0"
edition = "2021"
description = "A focused Jira Kanban TUI for daily project management"
license = "MIT"
repository = "https://github.com/caron14/jira-kanban-tui"
rust-version = "1.75"
authors = []

[[bin]]
name = "jira-kanban-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
open = "5"
url = "2"
base64 = "0.22"
dirs = "5"
unicode-width = "0.1"

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
