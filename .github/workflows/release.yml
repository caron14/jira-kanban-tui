name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - id: version
        name: Verify release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"${tag}"; then
            echo "Release tags must have the form vX.Y.Z: ${tag}" >&2
            exit 1
          fi
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - run: shellcheck install.sh tests/install_test.sh
      - run: tests/install_test.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: "11.0"
          - runner: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            macos_deployment_target: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            macos_deployment_target: ""
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          fi
          cargo build --locked --release --all-features --target "${TARGET}"
      - name: Verify and package binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/jira-kanban-tui"
          "${binary}" --version | grep -Fx "jira-kanban-tui ${{ needs.verify.outputs.version }}"
          if [[ "${RUNNER_OS}" == "Linux" ]] && readelf -d "${binary}" | grep -q '(NEEDED)'; then
            echo "Linux release binary is dynamically linked" >&2
            exit 1
          fi

          package_dir="${RUNNER_TEMP}/jira-kanban-tui-package"
          asset="jira-kanban-tui-${TARGET}.tar.gz"
          mkdir -p "${package_dir}" dist
          cp "${binary}" "${package_dir}/jira-kanban-tui"
          cp README.md LICENSE "${package_dir}/"
          tar -czf "dist/${asset}" -C "${package_dir}" jira-kanban-tui README.md LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}" >"${asset}.sha256")
          else
            (cd dist && shasum -a 256 "${asset}" >"${asset}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/*.sha256 | sort -k2 >release-assets/checksums.txt
          rm release-assets/*.sha256
          cp install.sh release-assets/install.sh
          asset_count=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "${asset_count}" -eq 6
      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*
      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          existing_draft=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ -n "${existing_draft}" && "${existing_draft}" != "true" ]]; then
            echo "Release ${TAG} already exists and is not a draft" >&2
            exit 1
          fi
          if [[ -z "${existing_draft}" ]]; then
            gh release create "${TAG}" --draft --verify-tag --generate-notes --title "${TAG}"
          fi
          gh release upload "${TAG}" release-assets/* --clobber
          gh release edit "${TAG}" --draft=false --latest
